      rel="stylesheet"

    <script>
      (function () {
        try {
          var redirect = sessionStorage.getItem("bompapoxa.redirect");
          if (!redirect) return;
          sessionStorage.removeItem("bompapoxa.redirect");
          var base = "/bompapoxa";
          var target = redirect.indexOf(base + "/") === 0 ? redirect : base + (redirect.charAt(0) === "/" ? redirect : "/" + redirect);
          history.replaceState(null, "", target);
        } catch (_) {}
      })();
    </script>

    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#faf5ec;color:#2a1710;font-family:system-ui,sans-serif">
        <p>Carregando o cardápio…</p>
